<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>zeckon claude-plugins</title>
<meta name="description" content="Claude Code plugins by zeckon, each with a short animated explainer.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Shared by the index and every plugin page. */
:root {
	--bg: #f4f3ef;
	--panel: #ffffff;
	--line: #d9d6cc;
	--fg: #16181c;
	--dim: #5f6672;
	--clay: #b8512f;
	--gb: #4c6a0a;
	--stage: #0b0d10;
	--display: 'Silkscreen', 'Courier New', monospace;
	--body: 'Hanken Grotesk', system-ui, sans-serif;
	--mono: 'JetBrains Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #0b0d10; --panel: #12151a; --line: #2b313b; --fg: #eceef2; --dim: #8a93a1; --clay: #e0845f; --gb: #9bbc0f; color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #0b0d10; --panel: #12151a; --line: #2b313b; --fg: #eceef2; --dim: #8a93a1; --clay: #e0845f; --gb: #9bbc0f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
	background: var(--bg);
	color: var(--fg);
	font-family: var(--body);
	font-size: 17px;
	line-height: 1.55;
	padding-block: 40px 72px;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 1240px; margin: 0 auto; display: grid; gap: 40px; }
header { display: grid; gap: 10px; }
.mark { font-family: var(--display); font-weight: 700; font-size: clamp(40px, 8vw, 84px); line-height: 1; color: var(--gb); letter-spacing: 0.02em; }
.sub { color: var(--dim); max-width: none; margin: 0; font-size: clamp(13px, 1.7vw, 19px); white-space: nowrap; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.screen { background: var(--stage); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
#player { min-height: 0; aspect-ratio: 16 / 9; }
.chapters { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.chapters button {
	all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
	display: grid; grid-template-columns: 3.4em 1fr; gap: 10px; align-items: baseline;
	padding: 8px 10px; border-radius: 6px; font-size: 15px; line-height: 1.3;
}
.chapters button:hover { background: var(--panel); }
.chapters button:focus-visible { outline: 2px solid var(--clay); outline-offset: 1px; }
.chapters button[aria-current="true"] { background: var(--panel); box-shadow: inset 3px 0 0 var(--clay); }
.chapters time { font-family: var(--mono); font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
.chapters .part { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--clay); padding: 14px 10px 4px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 32px; }
h2 { font-family: var(--mono); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay); margin: 0 0 12px; font-weight: 700; }
.cmd { display: flex; gap: 8px; align-items: stretch; margin: 0 0 10px; }
.cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-family: var(--mono); font-size: 14.5px; }
.cmd code::before { content: '> '; color: var(--clay); }
.cmd button { font: inherit; font-family: var(--mono); font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 0 14px; }
.cmd button:hover { border-color: var(--clay); }
.cmd button:focus-visible { outline: 2px solid var(--clay); outline-offset: 1px; }
p { margin: 0 0 12px; max-width: 62ch; }
a { color: var(--clay); }
.note { color: var(--dim); font-size: 15px; }
@media (max-width: 960px) { .stage { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) { .sub { white-space: normal; font-size: 16px; } }
.back { font-family: var(--mono); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); text-decoration: none; }
.back:hover, .back:focus-visible { color: var(--clay); }
.mark.clay { color: var(--clay); }
.files { color: var(--dim); font-size: 15px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
/* Index */
.hero { display: grid; gap: 14px; }
.hero .cmd { max-width: 640px; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
@media (max-width: 960px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { display: grid; gap: 12px; color: inherit; text-decoration: none; }
.card img { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: contain; border-radius: 10px; border: 1px solid var(--line); background: var(--stage); }
.card:hover img { border-color: var(--clay); }
.card:focus-visible { outline: 2px solid var(--clay); outline-offset: 4px; border-radius: 10px; }

</style>


</head>
<body>
<main>
	<header class="hero">
		<div class="mark clay">claude-plugins</div>
		<p class="sub">Claude Code plugins by zeckon.</p>
		<div class="cmd"><code id="c1">/plugin marketplace add zeckon/claude-plugins</code><button type="button" data-copy="c1">Copy</button></div>
	</header>

	<section class="grid" aria-label="Plugins">
		<a class="card" href="pixelbar/">
			<img src="pixelbar/poster.jpg?v=206b02aa" alt="pixelbar: A pixel-art status strip for Claude Code, and a three-minute look at how a mod draws it." loading="lazy" width="1080" height="1080">
		</a>
		<a class="card" href="history/">
			<img src="history/poster.jpg?v=c0294ca8" alt="history: Every Claude turn committed to a shadow git repo you can browse and restore from." loading="lazy" width="1080" height="1080">
		</a>
		<a class="card" href="devcontainers/">
			<img src="devcontainers/poster.jpg?v=de6edba7" alt="devcontainers: Author, run and sandbox dev containers from Claude Code." loading="lazy" width="1080" height="1080">
		</a>
		<a class="card" href="explain/">
			<img src="explain/poster.jpg?v=39cf8a82" alt="explain: Turn a code change into an interactive lesson." loading="lazy" width="1080" height="1080">
		</a>
	</section>

	<footer class="note">Source: <a href="https://github.com/zeckon/claude-plugins">zeckon/claude-plugins</a></footer>
</main>

<script>
document.querySelectorAll('[data-copy]').forEach(function (btn) {
	btn.addEventListener('click', function () {
		var el = document.getElementById(btn.getAttribute('data-copy'));
		var done = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1400); };
		var select = function () {
			var r = document.createRange(); r.selectNodeContents(el);
			var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
		};
		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(el.textContent).then(done, select);
		} else select();
	});
});
</script>

</body>
</html>
